app-id: io.github.mfat.jottr
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: jottr
separate-locales: false
cleanup-commands:
    - /app/cleanup-BaseApp.sh
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
  - --env=QTWEBENGINE_DISABLE_SANDBOX=1
modules:
  - name: enchant
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --enable-relocatable
    sources:
      - type: archive
        url: https://github.com/rrthomas/enchant/releases/download/v2.2.15/enchant-2.2.15.tar.gz
        sha256: 3b0f2215578115f28e2a6aa549b35128600394304bd79d6f28b0d3b3d6f46c03
    cleanup:
      - /share/doc
      - /share/man

  - name: adwaita-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DUSE_QT6=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: vendor/adwaita-qt

  - pypi-dependencies.yaml

  - name: jottr
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation .
      - mkdir -p ${FLATPAK_DEST}/share/jottr
      - cp -r icons ${FLATPAK_DEST}/share/jottr/icons
      - cp -r translations ${FLATPAK_DEST}/share/jottr/translations
      - install -D -m644 io.github.mfat.jottr.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -D icons/jottr_icon_16x16.png ${FLATPAK_DEST}/share/icons/hicolor/16x16/apps/io.github.mfat.jottr.png
      - install -D icons/jottr_icon_32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/io.github.mfat.jottr.png
      - install -D icons/jottr_icon_48x48.png ${FLATPAK_DEST}/share/icons/hicolor/48x48/apps/io.github.mfat.jottr.png
      - install -D icons/jottr_icon_64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/io.github.mfat.jottr.png
      - install -D icons/jottr_icon_128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.mfat.jottr.png
      - install -D icons/jottr_icon_256x256.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.mfat.jottr.png
      - install -D icons/jottr_icon_512x512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.mfat.jottr.png
      - install -D -m644 io.github.mfat.jottr.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
    sources:
      - type: git
        url: "https://github.com/mfat/jottr.git"
        tag: v1.4.3
        commit: ae78bb0d7f35e8ed49ad3e3d510cb569d86c16e2
