name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_as:
        description: >-
          Force a release PR at this version (e.g. 2.5.2), even with no
          feat/fix commits. Leave empty for normal conventional-commits behavior.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode ignores the action's release-as input. Push an empty
      # commit with a Release-As footer so release-please opens a PR anyway.
      - name: Checkout for forced release
        if: github.event_name == 'workflow_dispatch' && inputs.release_as != ''
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release-As commit
        if: github.event_name == 'workflow_dispatch' && inputs.release_as != ''
        run: |
          version="${{ inputs.release_as }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-].+)?$ ]]; then
            echo "Invalid version '$version' (expected semver like 2.5.2)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "chore: release ${version}" \
            -m "Release-As: ${version}"
          git push

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tag pushes from GITHUB_TOKEN do not trigger on: push workflows. Call Flathub
  # directly when Release Please creates a release.
  update-flathub:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/flathub.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}

  build-deb:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Jottr needs Qt >= 6.5 (Qt.ColorScheme); Ubuntu 24.04 ships Qt 6.4.
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            devscripts \
            debhelper \
            git

      - name: Create debian directory link
        run: |
          rm -rf debian
          ln -s packaging/debian debian

      # debian/changelog is not managed by release-please; stamp the release
      # version so the .deb's internal Version matches the tag.
      - name: Set Debian package version
        run: |
          version="$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' src/jottr/__init__.py)"
          if [ -z "$version" ]; then
            echo "Could not read __version__ from src/jottr/__init__.py"
            exit 1
          fi
          DEBFULLNAME="mFat" DEBEMAIL="newmfat@gmail.com" \
            dch --newversion "${version}-1" --distribution unstable "Release ${version}"

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          mv ../*.deb artifacts/

      - name: Install and smoke-test package
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./artifacts/*.deb desktop-file-utils
          desktop-file-validate /usr/share/applications/io.github.mfat.jottr.desktop
          cd / && python3 "$GITHUB_WORKSPACE/packaging/check-installed.py"

      - name: Name Debian release package
        run: |
          mkdir -p release-assets
          set -- artifacts/*.deb
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one Debian package, found $#"
            exit 1
          fi
          cp "$1" "release-assets/jottr-${{ needs.release-please.outputs.tag_name }}-linux-all.deb"

      - name: Upload Debian workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-release-package
          path: release-assets/*.deb
          retention-days: 14

      - name: Generate Debian checksum
        run: |
          cd release-assets
          for package in *.deb; do
            sha256sum "$package" > "$package.sha256"
          done

      - name: Upload Debian package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rpm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Pinned: a binary RPM requires the python(abi) of the Fedora it was built
    # on. Add versions here to publish RPMs for more Fedora releases.
    strategy:
      fail-fast: false
      matrix:
        fedora: ['44']
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmlint \
            python3-devel \
            desktop-file-utils

      - name: Set up RPM build environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp rpm.spec ~/rpmbuild/SPECS/

      - name: Get version from spec
        id: get_version
        run: |
          VERSION=$(grep "Version:" rpm.spec | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # rpm.spec's %changelog is not managed by release-please; add an entry
      # so the package changelog matches the release version.
      - name: Add RPM changelog entry
        run: |
          version="${{ steps.get_version.outputs.version }}"
          sed -i "/^%changelog$/a * $(LC_ALL=C date '+%a %b %d %Y') mFat <newmfat@gmail.com> - ${version}-1\n- Release ${version}\n" \
            ~/rpmbuild/SPECS/rpm.spec

      - name: Create source tarball
        run: |
          mkdir -p /tmp/jottr-${{ steps.get_version.outputs.version }}
          cp -r src LICENSE README.md icons translations \
            io.github.mfat.jottr.desktop io.github.mfat.jottr.metainfo.xml \
            /tmp/jottr-${{ steps.get_version.outputs.version }}/
          cd /tmp
          tar czf ~/rpmbuild/SOURCES/jottr-${{ steps.get_version.outputs.version }}.tar.gz jottr-${{ steps.get_version.outputs.version }}/

      - name: Build RPM package
        run: |
          cd ~/rpmbuild/SPECS
          rpmbuild -ba rpm.spec

      - name: Run rpmlint
        run: |
          rpmlint ~/rpmbuild/RPMS/noarch/jottr-*.rpm

      - name: Install and smoke-test package
        run: |
          dnf install -y ~/rpmbuild/RPMS/noarch/jottr-*.rpm
          desktop-file-validate /usr/share/applications/io.github.mfat.jottr.desktop
          cd / && python3 "$GITHUB_WORKSPACE/packaging/check-installed.py"

      - name: Collect RPM artifacts
        run: |
          mkdir -p artifacts
          cp ~/rpmbuild/RPMS/noarch/jottr-*.rpm artifacts/
          cp ~/rpmbuild/SRPMS/jottr-*.rpm artifacts/

      - name: Name RPM release packages
        run: |
          mkdir -p release-assets
          set -- artifacts/*.noarch.rpm
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one binary RPM package, found $#"
            exit 1
          fi
          binary_rpm="$1"
          set -- artifacts/*.src.rpm
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one source RPM package, found $#"
            exit 1
          fi
          cp "$binary_rpm" "release-assets/jottr-${{ needs.release-please.outputs.tag_name }}-fedora${{ matrix.fedora }}-noarch.rpm"
          cp "$1" "release-assets/jottr-${{ needs.release-please.outputs.tag_name }}-fedora${{ matrix.fedora }}-noarch.src.rpm"

      - name: Upload RPM workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-release-packages-fedora${{ matrix.fedora }}
          path: release-assets/*.rpm
          retention-days: 14

      - name: Generate RPM checksums
        run: |
          cd release-assets
          for package in *.rpm; do
            sha256sum "$package" > "$package.sha256"
          done

      - name: Upload RPM packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-appimage:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            file \
            libfuse2 \
            python3-venv \
            wget

      - name: Build Linux PyInstaller bundle
        run: |
          python3 -m venv build-venv
          build-venv/bin/python -m pip install --upgrade pip
          build-venv/bin/python -m pip install -r requirements.txt
          build-venv/bin/python -m pip install -e ".[build]"
          build-venv/bin/pyinstaller \
            --noconfirm \
            --windowed \
            --name jottr \
            --paths src \
            --collect-submodules jottr \
            --collect-data spellchecker \
            --hidden-import ctypes \
            --hidden-import ctypes.util \
            --hidden-import jottr \
            --hidden-import jottr.editor_tab \
            --hidden-import jottr.editor \
            --hidden-import jottr.editor.browser \
            --hidden-import jottr.editor.find_replace \
            --hidden-import jottr.editor.focus_mode \
            --hidden-import jottr.editor.markdown \
            --hidden-import jottr.editor.spellcheck \
            --hidden-import jottr.editor.tab \
            --hidden-import jottr.editor.text_edit \
            --hidden-import jottr.ui \
            --hidden-import jottr.ui.document_tab_bar \
            --hidden-import jottr.ui.workspace \
            --hidden-import jottr.ui.workspace_controller \
            --hidden-import jottr.window \
            --hidden-import jottr.font_dialog \
            --hidden-import jottr.file_dialogs \
            --hidden-import jottr.icon_manager \
            --hidden-import jottr.resources \
            --hidden-import jottr.paths \
            --hidden-import jottr.plugin_manager \
            --hidden-import jottr.qt_style \
            --hidden-import jottr.window_color_scheme \
            --hidden-import jottr.settings_dialog \
            --hidden-import jottr.settings_manager \
            --hidden-import jottr.snippet_editor_dialog \
            --hidden-import jottr.snippet_manager \
            --hidden-import jottr.theme_manager \
            --hidden-import jottr.translation_manager \
            --hidden-import pyenchant \
            --hidden-import pyspellchecker \
            --hidden-import spellchecker \
            --hidden-import feedparser \
            --hidden-import requests \
            --hidden-import certifi \
            --collect-data certifi \
            --add-data "src/jottr/help:jottr/help" \
            --add-data "src/jottr/icons:jottr/icons" \
            --add-data "src/jottr/resources:jottr/resources" \
            --add-data "src/jottr/editor/data:jottr/editor/data" \
            --add-data "icons:icons" \
            --add-data "translations:translations" \
            src/jottr/main.py

      - name: Build AppDir
        run: |
          version="${{ needs.release-please.outputs.tag_name }}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/jottr AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -r dist/jottr/* AppDir/usr/share/jottr/
          cp icons/jottr.svg AppDir/usr/share/icons/hicolor/scalable/apps/io.github.mfat.jottr.svg
          cp icons/jottr.svg AppDir/jottr.svg
          # AppImage root desktop keeps Icon=jottr for appimagetool; applications/
          # entry must match setDesktopFileName for shell/dock association.
          cp io.github.mfat.jottr.desktop AppDir/usr/share/applications/io.github.mfat.jottr.desktop
          cp io.github.mfat.jottr.desktop AppDir/jottr.desktop
          sed -i 's/^Icon=.*/Icon=jottr/' AppDir/jottr.desktop
          printf '%s\n' \
            '#!/bin/sh' \
            'APPDIR="${APPDIR:-$(dirname "$(readlink -f "$0")")}"' \
            'export QTWEBENGINE_DISABLE_SANDBOX=1' \
            'exec "$APPDIR/usr/share/jottr/jottr" "$@"' \
            > AppDir/AppRun
          chmod +x AppDir/AppRun
          printf '%s\n' \
            '#!/bin/sh' \
            'SELF="$(readlink -f "$0")"' \
            'APPDIR="${APPDIR:-$(dirname "$(dirname "$(dirname "$SELF")")")}"' \
            'exec "$APPDIR/AppRun" "$@"' \
            > AppDir/usr/bin/jottr
          chmod +x AppDir/usr/bin/jottr
          desktop-file-validate AppDir/usr/share/applications/io.github.mfat.jottr.desktop
          echo "APPIMAGE_VERSION=$version" >> $GITHUB_ENV

      - name: Build AppImage
        run: |
          mkdir -p release-assets
          wget -O appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir "release-assets/jottr-${APPIMAGE_VERSION}-linux-x86_64.AppImage"

      - name: Upload AppImage workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-release-package
          path: release-assets/*.AppImage
          retention-days: 14

      - name: Generate AppImage checksum
        run: |
          cd release-assets
          for package in *.AppImage; do
            sha256sum "$package" > "$package.sha256"
          done

      - name: Upload AppImage package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
            file_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            file_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # stage-enchant.sh prefers Homebrew enchant, then builds from source
      # (Flatpak-style, --enable-relocatable + AppleSpell) using glib from
      # Homebrew. Intel runners often lack enchant bottles; glib is enough.
      - name: Install macOS Enchant build dependencies
        run: |
          brew update
          brew install glib gettext pkgconf
          brew install enchant || echo "Homebrew enchant unavailable; stage-enchant.sh will build from source"

      - name: Install macOS build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build and package DMG
        env:
          EXPECTED_FILE_ARCH: ${{ matrix.file_arch }}
        run: |
          chmod +x packaging/macos/build-dmg.sh
          packaging/macos/build-dmg.sh \
            "${{ needs.release-please.outputs.tag_name }}" \
            release-assets

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-package-${{ matrix.arch }}
          path: release-assets/*.dmg
          retention-days: 14

      - name: Generate macOS checksum
        run: |
          cd release-assets
          for package in *.dmg; do
            shasum -a 256 "$package" > "$package.sha256"
          done

      - name: Upload macOS package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Windows build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build and package installer
        env:
          EXPECTED_FILE_ARCH: x64
        shell: pwsh
        run: |
          ./packaging/windows/build-installer.ps1 `
            "${{ needs.release-please.outputs.tag_name }}" `
            release-assets

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-package-x86_64
          path: release-assets/*.exe
          retention-days: 14

      - name: Generate Windows checksum
        shell: bash
        run: |
          cd release-assets
          for package in *.exe; do
            sha256sum "$package" > "$package.sha256"
          done

      - name: Upload Windows package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
